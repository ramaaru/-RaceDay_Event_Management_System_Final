name: .NET

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore RaceDay.sln
      - name: Build
        run: dotnet build RaceDay.sln --no-restore --configuration Release
      - name: Build tests
        run: dotnet build RaceDay.Tests/RaceDay.Tests.csproj --no-restore --configuration Release
      - name: Test
        run: dotnet test RaceDay.Tests/RaceDay.Tests.csproj --no-build --configuration Release
